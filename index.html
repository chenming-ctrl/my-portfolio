<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chenming LI | Neural Architecture Portfolio</title>
    <style>
        :root { --bg-blur: 0px; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #fff; font-family: "Helvetica Neue", sans-serif; overflow: hidden; touch-action: none; -webkit-font-smoothing: antialiased; }
        #canvas-container { position: fixed; width: 100%; height: 100%; z-index: 1; transition: filter 1s ease; filter: blur(var(--bg-blur)); pointer-events: none; }
        nav { position: fixed; top: 0; left: 0; width: 100%; padding: 40px 60px; display: flex; justify-content: space-between; align-items: center; z-index: 5000; box-sizing: border-box; opacity: 0; transform: translateY(-20px); transition: 0.8s ease; pointer-events: none; }
        nav.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .nav-logo { font-size: 0.9rem; font-weight: 600; letter-spacing: 2px; cursor: pointer; color: #000; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #999; font-size: 0.6rem; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .nav-links a:hover { color: #000; }
        #lvl1 h1 { font-size: 3.5rem; font-weight: 100; letter-spacing: 20px; margin-bottom: 20px; text-transform: uppercase; color: #000; }
        #lvl1 p { font-size: 0.55rem; color: #aaa; letter-spacing: 8px; text-transform: uppercase; margin-top: 0; }
        .neural-grid { display: flex; gap: 70px; justify-content: center; align-items: center; width: 95%; flex-wrap: wrap; padding: 20px; }
        .stack-container { position: relative; width: 160px; height: 220px; cursor: pointer; text-align: center; perspective: 1000px; }
        .neural-stack { position: relative; width: 140px; height: 140px; transform-style: preserve-3d; margin: 0 auto; transition: transform 0.6s; }
        .neural-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; border: 1px solid rgba(0,0,0,0.05); overflow: hidden; transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.02); display: flex; align-items: center; justify-content: center; }
        .neural-layer img { width: 100%; height: 100%; object-fit: cover; }
        .layer-1 { z-index: 5; }
        .layer-2 { z-index: 4; transform: translate(10px, -10px); opacity: 0.6; }
        .layer-3 { z-index: 3; transform: translate(20px, -20px); opacity: 0.3; }
        .stack-container:hover .layer-1 { transform: translate(-15px, 15px) rotate(-3deg); box-shadow: 15px 15px 30px rgba(0,0,0,0.1); }
        .stack-container:hover .layer-2 { transform: translate(5px, -5px); opacity: 0.8; }
        .stack-container:hover .layer-3 { transform: translate(22px, -22px); opacity: 0.5; }
        .stack-label { margin-top: 35px; font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: #bbb; transition: 0.4s; }
        .stack-container:hover .stack-label { color: #000; letter-spacing: 5px; }
        .delete-proj-btn { position: absolute; top: -10px; right: -10px; width: 24px; height: 24px; background: #ff4335; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; z-index: 100; opacity: 0; transition: 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .stack-container:hover .delete-proj-btn { opacity: 1; }
        .view-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; opacity: 0; visibility: hidden; transition: 0.8s cubic-bezier(0.165, 0.84, 0.44, 1); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .view-layer.active { opacity: 1; visibility: visible; }
        #lvl4 { background: #fbfbfb; z-index: 6000; display: none; }
        #miro-viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        .miro-item { position: absolute; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 2px solid transparent; user-select: none; }
        .miro-item.selected { border: 2px solid #4285F4; z-index: 1000 !important; }
        .crop-container { width: 100%; height: 100%; overflow: hidden; position: relative; }
        .miro-item img, .miro-item video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
        .resize-handle { position: absolute; width: 12px; height: 12px; background: #4285F4; right: -6px; bottom: -6px; cursor: nwse-resize; display: none; z-index: 1001; border-radius: 50%; }
        .miro-item.selected .resize-handle { display: flex; }
        .guide-line { position: absolute; background: rgba(66, 133, 244, 0.4); pointer-events: none; z-index: 5000; display: none; }
        #guide-x { width: 1px; height: 20000px; top: -10000px; border-left: 1px dashed #4285F4; }
        #guide-y { height: 1px; width: 20000px; left: -10000px; border-top: 1px dashed #4285F4; }
        .miro-ui { position: fixed; bottom: 80px; left: 60px; z-index: 9000; display: flex; align-items: center; gap: 15px; }
        .ui-btn { background: #fff; padding: 12px 24px; border-radius: 40px; font-size: 0.6rem; letter-spacing: 1px; cursor: pointer; border: 1px solid #eee; text-transform: uppercase; transition: 0.3s; }
        .back-btn-container { position: fixed; bottom: 30px; left: 60px; z-index: 7001; opacity: 0; transform: translateY(10px); transition: 0.5s ease; pointer-events: none; }
        .back-btn-container.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .back-btn { font-size: 0.55rem; letter-spacing: 3px; color: #999; cursor: pointer; text-transform: uppercase; padding: 10px; }
        #global-upload-list { position: fixed; bottom: 100px; right: 30px; width: 240px; z-index: 9999; pointer-events: none; }
        #loading-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .admin-lock { position: fixed; bottom: 30px; right: 60px; font-size: 0.45rem; color: #ccc; cursor: pointer; z-index: 8000; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="loading-screen">
    <div style="width: 100px; height: 1px; background: #eee; position: relative; overflow: hidden;"><div id="loading-bar" style="width: 0%; height: 100%; background: #000; transition: 0.3s;"></div></div>
</div>

<div id="global-upload-list"></div>
<div id="canvas-container"><canvas id="particleCanvas"></canvas></div>
<nav id="mainNav"><div class="nav-logo" onclick="showLevel(1)">CHENMING</div><div id="dynamicNav" class="nav-links"></div></nav>
<div id="backBtnContainer" class="back-btn-container">
    <div id="addProjBtn" class="back-btn" style="display:none; color: #34A853; margin-bottom:10px;" onclick="createNewProject()">+ NEW PROJECT</div>
    <div id="restoreProjBtn" class="back-btn" style="display:none; color: #FBBC05; margin-bottom:10px;" onclick="showGlobalRestoreList()">↺ RESTORE PROJECT</div>
    <div class="back-btn" onclick="handleBack()">← BACK</div>
</div>

<div class="view-layer active" id="lvl1">
    <div onclick="showLevel(2)" style="cursor:pointer; text-align:center"><h1>CHENMING LI</h1><p>Architecture & Computation Portfolio</p></div>
</div>
<div id="lvl2" class="view-layer"><div class="neural-grid" id="catGrid"></div></div>
<div id="lvl3" class="view-layer"><div class="neural-grid" id="projGrid"></div></div>
<div id="lvl4" class="view-layer">
    <div class="lvl4-header" style="position: fixed; top: 100px; left: 60px; z-index: 7000; pointer-events: none;">
        <div id="lvl4CatTag" style="font-size: 0.45rem; color: #ccc; letter-spacing: 4px; margin-bottom: 8px;">CATEGORY</div>
        <div id="lvl4Title" style="pointer-events: auto; outline:none; font-size: 1.5rem; font-weight: 200;" contenteditable="true" onblur="saveToCloud()">PROJECT TITLE</div>
    </div>
    <div id="miro-viewport">
        <div id="guide-x" class="guide-line"></div>
        <div id="guide-y" class="guide-line"></div>
    </div>
    <div class="miro-ui" id="adminControls" style="display:none;">
        <button class="ui-btn" onclick="document.getElementById('fileInput').click()">+ MEDIA</button>
        <button class="ui-btn" onclick="addLink()">+ LINK</button>
        <button class="ui-btn" onclick="addText()">+ TEXT</button>
        <button class="ui-btn" id="manualSaveBtn" style="background: #000; color: #fff; border: none;" onclick="manualSaveWithBackup()">SAVE & BACKUP</button>
        <button class="ui-btn" id="restoreBtn" style="border-color: #FBBC05; color: #FBBC05;" onclick="showRestoreList()">RESTORE</button>
    </div>
    <input type="file" id="fileInput" hidden multiple onchange="handleUpload(event)">
</div>
<div class="admin-lock" onclick="checkUnlock()" id="adminInfo">ADMIN LOGIN</div>

<script>
    const CONFIG = {
        owner: 'chenming-ctrl', 
        repo: 'my-portfolio-data', 
        path: 'portfolio_data.json',
        backupDir: 'backups',
        get token() { return (localStorage.getItem('gh_token') || '').trim(); }
    };

    function getAssetUrl(rawUrl) {
        if (!rawUrl || !rawUrl.includes('github.com')) return rawUrl;
        return rawUrl.replace('raw.githubusercontent.com', 'cdn.jsdelivr.net/gh').replace('github.com', 'cdn.jsdelivr.net/gh').replace('/blob/main/', '@main/').replace('/main/', '@main/');
    }

    let portfolio_data = {}, isAdmin = false, currentLvl = 1, currentCat = '', currentProj = null;
    let zoom = 1, panX = 0, panY = 0, isPanning = false, isDragging = false, isResizing = false;
    let dragTarget = null, startX, startY, startW;
    let historyStack = [];
    let isSaving = false, savePending = false; 
    const vp = document.getElementById('miro-viewport'), bd = document.getElementById('lvl4');

    async function saveToCloud() { 
        if(!isAdmin) return; 
        if (isSaving) { savePending = true; return; }
        isSaving = true;
        try {
            if(currentLvl === 4 && currentProj) {
                const items = Array.from(vp.children).filter(el => el.classList.contains('miro-item')).map(el => ({
                    html: el.querySelector('.crop-container').innerHTML, 
                    x: el.style.left, y: el.style.top, w: el.style.width, h: el.style.height
                })); 
                if(portfolio_data[currentProj.id]) {
                    portfolio_data[currentProj.id].layout = items; 
                    portfolio_data[currentProj.id].title = document.getElementById('lvl4Title').innerText; 
                    portfolio_data[currentProj.id].thumbs = items.filter(it => it.html.includes('<img')).slice(0,3).map(it => it.html.match(/src="([^"]+)"/)?.[1]);
                }
            }
            const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`; 
            const getSha = await fetch(`${url}?t=${Date.now()}`, { headers: {'Authorization': `token ${CONFIG.token}`} }); 
            const sha = (await getSha.json()).sha; 
            await fetch(url, {
                method: 'PUT', headers: {'Authorization': `token ${CONFIG.token}`}, 
                body: JSON.stringify({ message: "Sync Data", content: btoa(unescape(encodeURIComponent(JSON.stringify(portfolio_data, null, 2)))), sha })
            }); 
        } catch (e) { console.error("Sync Error:", e); }
        isSaving = false;
        if (savePending) { savePending = false; saveToCloud(); }
    }

    // --- 优化的自动备份：命名格式改为 项目名_时间_编号 ---
    async function runAutoBackup(reason = "Auto") {
        if (!isAdmin || !currentProj) return;
        try {
            const now = new Date();
            // 格式: YYYYMMDD_HHMM
            const timeStr = now.getFullYear() +
                            (now.getMonth()+1).toString().padStart(2,'0') +
                            now.getDate().toString().padStart(2,'0') + '_' +
                            now.getHours().toString().padStart(2,'0') +
                            now.getMinutes().toString().padStart(2,'0');

            // 净化文件名，防止非法字符
            const safeTitle = currentProj.title.trim().replace(/\s+/g, '_').replace(/[\\/:*?"<>|]/g, '');
            const baseName = `${safeTitle}_${timeStr}`;

            const listUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.backupDir}`;
            const res = await fetch(listUrl, { headers: { 'Authorization': `token ${CONFIG.token}` } });
            
            let nextNum = 1;
            if (res.ok) {
                const files = await res.json();
                // 查找同名同分钟的文件，编号递增
                const existing = files.filter(f => f.name.includes(baseName));
                nextNum = existing.length + 1;
            }

            // 文件名：项目名_时间_编号.json
            const fileName = `${baseName}_${nextNum.toString().padStart(2, '0')}.json`;
            
            await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.backupDir}/${fileName}`, {
                method: 'PUT', headers: { 'Authorization': `token ${CONFIG.token}` },
                // 内容中保存原始ID，确保恢复时能对应
                body: JSON.stringify({ 
                    message: `Backup [${reason}]: ${currentProj.title}`, 
                    content: btoa(unescape(encodeURIComponent(JSON.stringify({
                        originalId: currentProj.id,
                        ...portfolio_data[currentProj.id]
                    }, null, 2)))) 
                })
            });
            
            // 简单的轮替机制：保留最近20个同项目备份 (根据标题匹配)
            if (res.ok) {
                const files = await res.json();
                const myBackups = files.filter(f => f.name.startsWith(safeTitle)).sort((a,b) => a.name.localeCompare(b.name));
                if (myBackups.length > 20) {
                     await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${myBackups[0].path}`, {
                        method: 'DELETE', headers: { 'Authorization': `token ${CONFIG.token}` },
                        body: JSON.stringify({ message: "Rotate", sha: myBackups[0].sha })
                    });
                }
            }
        } catch (e) { console.error("Backup Failed:", e); }
    }

    // --- 核心恢复逻辑：通用处理函数 ---
    async function performRestore(fileInfo, isGlobal = false) {
        const taskId = "restore_" + Date.now();
        try {
            uploadQueue.tasks[taskId] = { fileName: fileInfo.name, progress: 20, status: 'loading', statusText: '正在下载...' };
            uploadQueue.updateUI();

            const r = await fetch(fileInfo.download_url);
            const backupContent = await r.json();
            
            if (!backupContent.title || !backupContent.layout) throw new Error("数据格式无效");

            // 优先使用备份里的 originalId，如果没有则使用文件名 ID，最后回退到 currentProj
            let id = backupContent.originalId; 
            if (!id && isGlobal) id = fileInfo.name.split('_')[0]; 
            if (!id && currentProj) id = currentProj.id;
            
            // 如果是新命名格式且没有ID，尝试生成或匹配
            if (!id) id = currentCat[0].toLowerCase() + Date.now();

            uploadQueue.tasks[taskId].progress = 60;
            uploadQueue.tasks[taskId].statusText = '同步数据库...';
            uploadQueue.updateUI();

            portfolio_data[id] = {
                title: backupContent.title,
                layout: backupContent.layout,
                thumbs: backupContent.thumbs || []
            };

            await saveToCloud();

            uploadQueue.tasks[taskId].progress = 100;
            uploadQueue.tasks[taskId].status = 'done';
            uploadQueue.tasks[taskId].statusText = '恢复成功';
            uploadQueue.updateUI();

            if (isGlobal) {
                renderProjGrid(); 
            } else {
                currentProj = { id: id, ...portfolio_data[id] };
                showLevel(4);
            }
            setTimeout(() => { delete uploadQueue.tasks[taskId]; uploadQueue.updateUI(); }, 2000);
        } catch (e) {
            alert("恢复失败: " + e.message);
            delete uploadQueue.tasks[taskId];
            uploadQueue.updateUI();
        }
    }

    // --- 恢复列表：项目内恢复 (按时间倒序) ---
    async function showRestoreList() {
        if (!isAdmin || !currentProj) return;
        try {
            const listUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.backupDir}`;
            const res = await fetch(listUrl, { headers: { 'Authorization': `token ${CONFIG.token}` } });
            const files = await res.json();
            
            // 匹配项目标题或ID
            const safeTitle = currentProj.title.trim().replace(/\s+/g, '_').replace(/[\\/:*?"<>|]/g, '');
            const pbs = files.filter(f => f.name.includes(currentProj.id) || f.name.startsWith(safeTitle))
                             .sort((a, b) => b.name.localeCompare(a.name)); // 倒序
            
            if (pbs.length === 0) { alert("暂无备份。"); return; }
            
            const msg = `选择版本恢复 (最新的在前)：\n\n` + pbs.map((f, i) => `${i+1}. ${f.name}`).join('\n');
            const choice = prompt(msg);
            if (choice && pbs[choice-1]) {
                if(!confirm("确认恢复？当前未保存内容将丢失。")) return;
                await performRestore(pbs[choice-1], false);
            }
        } catch (e) { alert("获取备份失败"); }
    }

    // --- 全局恢复列表：分组显示 (按项目名分组，时间倒序) ---
    async function showGlobalRestoreList() {
        if (!isAdmin) return;
        try {
            const listUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.backupDir}`;
            const res = await fetch(listUrl, { headers: { 'Authorization': `token ${CONFIG.token}` } });
            const files = await res.json();
            
            // 获取最近50个文件
            let allBackups = files.sort((a, b) => b.name.localeCompare(a.name)).slice(0, 50);
            if (allBackups.length === 0) { alert("暂无备份记录。"); return; }

            // 分组逻辑
            const groups = {};
            allBackups.forEach(f => {
                // 简单猜测项目名：取第一个下划线前的部分 (针对新格式) 或 ID (旧格式)
                let pName = f.name.split('_')[0]; 
                // 如果是旧格式ID (例如 a176...)，尝试在 portfolio_data 查找标题，找不到就用ID
                if(pName.match(/^[a-z]\d+$/) && portfolio_data[pName]) pName = portfolio_data[pName].title;
                
                if (!groups[pName]) groups[pName] = [];
                groups[pName].push(f);
            });

            // 构建显示文本
            let displayMsg = "【 找回已删除项目 】\n输入编号恢复：\n";
            let flatList = []; 
            let counter = 1;

            for (let name in groups) {
                displayMsg += `\n📂 ${name}\n`; 
                groups[name].forEach(f => {
                    let displayName = f.name;
                    // 如果是新格式，去掉前面的名字，只显示时间
                    if(f.name.startsWith(name)) displayName = f.name.replace(name+'_', '').replace('.json','');
                    displayMsg += `   ${counter}. ${displayName}\n`;
                    flatList.push(f);
                    counter++;
                });
            }

            const choice = prompt(displayMsg);
            const index = parseInt(choice) - 1;

            if (choice && flatList[index]) {
                if(confirm(`确认恢复文件：${flatList[index].name}？`)) {
                    await performRestore(flatList[index], true);
                }
            }
        } catch (e) { alert("列表获取失败: " + e.message); }
    }

    async function manualSaveWithBackup() {
        const btn = document.getElementById('manualSaveBtn');
        btn.innerText = "SAVING..."; await saveToCloud(); await runAutoBackup("Manual");
        btn.innerText = "SUCCESS"; setTimeout(() => btn.innerText = "SAVE & BACKUP", 2000);
    }

    async function initSystem() {
        const cdnUrl = `https://cdn.jsdelivr.net/gh/${CONFIG.owner}/${CONFIG.repo}@main/${CONFIG.path}`;
        const apiUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`;
        let success = false;
        if (isAdmin && CONFIG.token) {
            try {
                const res = await fetch(`${apiUrl}?t=${Date.now()}`, { headers: {'Authorization': `token ${CONFIG.token}`} });
                if (res.ok) { portfolio_data = JSON.parse(decodeURIComponent(escape(atob((await res.json()).content)))); success = true; }
            } catch(e) {}
        }
        if (!success) {
            try {
                const res = await fetch(cdnUrl);
                if (res.ok) { portfolio_data = await res.json(); success = true; }
            } catch(e) {}
        }
        document.getElementById('loading-bar').style.width = "100%";
        setTimeout(() => { document.getElementById('loading-screen').style.display = "none"; }, 500);
        if(currentLvl === 2) renderCatGrid();
    }

    function renderCatGrid() { 
        const cats=['Architecture','Computational','Interest','Photo','Ongoing']; 
        document.getElementById('catGrid').innerHTML=cats.map(cat=>{
            const ps=Object.keys(portfolio_data).filter(id=>id.startsWith(cat[0].toLowerCase())); 
            const t=(ps.length&&portfolio_data[ps[0]].thumbs)?getAssetUrl(portfolio_data[ps[0]].thumbs[0]):''; 
            return `<div class="stack-container" onclick="showLevel(3, '${cat}')"><div class="neural-stack"><div class="neural-layer layer-2"></div><div class="neural-layer layer-1">${t?`<img src="${t}">`:''}</div></div><div class="stack-label">${cat}</div></div>`;
        }).join(''); 
    }

    function renderProjGrid() { 
        const ps=Object.keys(portfolio_data).filter(id=>id.startsWith(currentCat[0].toLowerCase())).map(id=>({id,...portfolio_data[id]})); 
        document.getElementById('projGrid').innerHTML=ps.map(p=>{
            const t=(p.thumbs||[]).map(url => getAssetUrl(url)); 
            const delBtn = isAdmin ? `<div class="delete-proj-btn" onclick="event.stopPropagation(); deleteProject('${p.id}', '${p.title}')">×</div>` : '';
            return `<div class="stack-container" onclick="openProject('${p.id}')">${delBtn}<div class="neural-stack"><div class="neural-layer layer-3">${t[2]?`<img src="${t[2]}">`:''}</div><div class="neural-layer layer-2">${t[1]?`<img src="${t[1]}">`:''}</div><div class="neural-layer layer-1">${t[0]?`<img src="${t[0]}">`:''}</div></div><div class="stack-label">${p.title}</div></div>`;
        }).join(''); 
    }

    function createMiroItem(content, x, y, w = "300px", h = "auto") {
        const d = document.createElement('div');
        d.className = 'miro-item'; d.style.cssText = `left:${x}; top:${y}; width:${w}; height:${h};`;
        const speedContent = content.replace(/src="([^"]+)"/g, (match, p1) => `src="${getAssetUrl(p1)}"`);
        d.innerHTML = `<div class="crop-container">${speedContent}</div><div class="resize-handle"></div>`;
        const edit = d.querySelector('[contenteditable]');
        d.onmousedown = (e) => {
            if (e.target.contentEditable === "true" || !isAdmin || e.button !== 0) return;
            e.stopPropagation(); document.querySelectorAll('.miro-item').forEach(el => el.classList.remove('selected'));
            d.classList.add('selected'); vp.appendChild(d); isDragging = true; dragTarget = d;
            startX = (e.clientX/zoom) - parseInt(d.style.left); startY = (e.clientY/zoom) - parseInt(d.style.top);
        };
        if(edit) { 
            edit.contentEditable = "false";
            d.ondblclick = (e) => { if(!isAdmin) return; e.stopPropagation(); edit.contentEditable = "true"; edit.focus(); isDragging = false; dragTarget = null; }; 
            edit.onblur = () => { edit.contentEditable = "false"; saveHistory(); saveToCloud(); }; 
        }
        const rh = d.querySelector('.resize-handle');
        rh.onmousedown = (e) => { e.stopPropagation(); e.preventDefault(); isResizing = true; dragTarget = d; startW = parseInt(d.style.width); startX = e.clientX; };
        vp.appendChild(d); return d;
    }

    function saveHistory() {
        const state = Array.from(vp.children).filter(el => el.classList.contains('miro-item')).map(el => ({ html: el.querySelector('.crop-container').innerHTML, x: el.style.left, y: el.style.top, w: el.style.width, h: el.style.height }));
        historyStack.push(JSON.stringify(state)); if(historyStack.length > 30) historyStack.shift();
    }
    
    function undo() {
        if(historyStack.length <= 1) return; historyStack.pop();
        const prevState = JSON.parse(historyStack[historyStack.length - 1]);
        Array.from(vp.children).forEach(el => { if(el.classList.contains('miro-item')) el.remove(); });
        prevState.forEach(it => createMiroItem(it.html, it.x, it.y, it.w, it.h));
    }

    const cvs = document.getElementById('particleCanvas'), ctx = cvs.getContext('2d');
    let pts = [], m = { x: 0, y: 0, smX: 0, smY: 0, vx: 0, vy: 0 };
    window.addEventListener('mousemove', e => { m.x = e.clientX; m.y = e.clientY; });
    class Particle {
        constructor() { this.x = Math.random()*cvs.width; this.y = Math.random()*cvs.height; this.bs = Math.random()*2+2; this.s = this.bs; this.c = ['#4285F4','#34A853','#FBBC05','#EA4335','#9b59b6'][Math.floor(Math.random()*5)]; this.v = {x:(Math.random()-0.5)*0.3, y:(Math.random()-0.5)*0.3}; this.st = 1; this.a = 0; }
        update() {
            this.x += this.v.x; this.y += this.v.y; if(this.x<0||this.x>cvs.width) this.v.x*=-1; if(this.y<0||this.y>cvs.height) this.v.y*=-1;
            let d = Math.hypot(m.smX-this.x, m.smY-this.y);
            if(d < 180) { let f = (180-d)/180; this.s = this.bs + f*25; this.st = 1 + (Math.hypot(m.vx, m.vy)*0.15*f); this.a = Math.atan2(m.vy, m.vx); }
            else { this.s += (this.bs-this.s)*0.1; this.st += (1-this.st)*0.1; }
            ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.a); ctx.beginPath(); ctx.ellipse(0, 0, this.s*this.st, this.s, 0, 0, Math.PI*2); ctx.fillStyle = this.c; ctx.globalAlpha = (currentLvl > 1) ? 0.2 : 0.45; ctx.fill(); ctx.restore();
        }
    }

    window.onmousemove = (e) => {
        if(isPanning) { panX = e.clientX - startX; panY = e.clientY - startY; updateViewport(); }
        else if(isDragging && dragTarget && !isResizing) {
            dragTarget.style.left = ((e.clientX/zoom) - startX) + "px"; dragTarget.style.top = ((e.clientY/zoom) - startY) + "px";
        } else if(isResizing && dragTarget) { dragTarget.style.width = Math.max(50, startW + (e.clientX - startX)/zoom) + "px"; }
    };
    window.onmouseup = () => { if(isDragging || isResizing) { saveHistory(); saveToCloud(); } isDragging = isResizing = isPanning = false; };
    bd.onmousedown = (e) => { if(currentLvl === 4 && (e.button === 1 || e.target === bd || e.target === vp)) { isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY; e.preventDefault(); } };
    bd.addEventListener('wheel', e => { if(currentLvl === 4) { e.preventDefault(); const f = Math.pow(1.1, -e.deltaY/120); const nz = Math.min(Math.max(zoom * f, 0.05), 5); panX = e.clientX - (e.clientX - panX) * (nz/zoom); panY = e.clientY - (e.clientY - panY) * (nz/zoom); zoom = nz; updateViewport(); } }, {passive:false});
    function updateViewport() { vp.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`; }

    const uploadQueue = { tasks: {}, updateUI() { const list = document.getElementById('global-upload-list'); list.innerHTML = Object.values(this.tasks).map(t => `<div style="background:rgba(255,255,255,0.9); padding:12px; border-radius:10px; margin-bottom:10px; box-shadow:0 8px 20px rgba(0,0,0,0.1); border-left:4px solid ${t.status==='done'?'#34A853':(t.status==='loading'?'#FBBC05':'#4285F4')}; backdrop-filter:blur(5px);"><div style="font-size:10px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${t.fileName}</div><div style="font-size:9px; color:#888; margin:4px 0;">${t.statusText}</div><div style="height:3px; background:#eee; width:100%; border-radius:2px; overflow:hidden;"><div style="width:${t.progress}%; height:100%; background:${t.status==='loading'?'#FBBC05':'#4285F4'}; transition:0.3s;"></div></div></div>`).join(''); } };

    async function handleUpload(e) {
        if(!isAdmin || !currentProj) return;
        const fs = Array.from(e.target.files); const dx = (window.innerWidth/2 - panX)/zoom, dy = (window.innerHeight/2 - panY)/zoom;
        fs.forEach(async (file, idx) => {
            const taskId = "t_" + Date.now() + "_" + idx; uploadQueue.tasks[taskId] = { fileName: file.name, progress: 10, status: 'uploading', statusText: '同步中...' }; uploadQueue.updateUI();
            const r = new FileReader(); r.onload = async (re) => {
                const item = createMiroItem(file.type.includes('image') ? `<img src="${re.target.result}">` : `<video src="${re.target.result}" autoplay loop muted></video>`, (dx+idx*30)+'px', (dy+idx*30)+'px');
                const b64 = re.target.result.split(',')[1];
                const xhr = new XMLHttpRequest(); xhr.open('PUT', `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/media/${Date.now()}_${file.name}`);
                xhr.setRequestHeader('Authorization', `token ${CONFIG.token}`);
                xhr.upload.onprogress = (ev) => { uploadQueue.tasks[taskId].progress = 30 + Math.round((ev.loaded/ev.total)*65); uploadQueue.updateUI(); };
                xhr.onload = () => { if(xhr.status<300){ const url = JSON.parse(xhr.responseText).content.download_url; item.querySelector('img, video').src = getAssetUrl(url); uploadQueue.tasks[taskId].status = 'done'; uploadQueue.updateUI(); saveToCloud(); setTimeout(()=> {delete uploadQueue.tasks[taskId]; uploadQueue.updateUI();}, 2000); } };
                xhr.send(JSON.stringify({message: "Upload", content: b64}));
            }; r.readAsDataURL(file);
        });
    }

    function addLink() { const url = prompt("Link:"); if(!url) return; createMiroItem(`<iframe src="${url}" style="width:100%; height:100%; pointer-events:auto;"></iframe>`, '400px', '400px', '480px', '270px'); saveHistory(); saveToCloud(); }
    
    function showLevel(lvl, cat = '') {
        currentLvl=lvl; if(cat)currentCat=cat; 
        document.querySelectorAll('.view-layer').forEach(el=>el.classList.remove('active')); 
        document.getElementById('lvl4').style.display=(lvl===4)?'flex':'none'; 
        if(lvl===2)renderCatGrid(); if(lvl===3)renderProjGrid(); 
        if(lvl===4){
            Array.from(vp.children).forEach(el => { if(el.classList.contains('miro-item')) el.remove(); });
            (portfolio_data[currentProj.id].layout||[]).forEach(it=>createMiroItem(it.html,it.x,it.y,it.w,it.h)); 
            document.getElementById('lvl4Title').innerText=portfolio_data[currentProj.id].title; document.getElementById('lvl4CatTag').innerText=currentCat;
            document.getElementById('adminControls').style.display = isAdmin ? 'flex' : 'none';
        }
        document.getElementById('lvl'+lvl).classList.add('active'); 
        document.documentElement.style.setProperty('--bg-blur', [0,15,30,0][lvl-1]+'px'); 
        document.getElementById('mainNav').classList.toggle('visible', lvl>1); 
        document.getElementById('backBtnContainer').classList.toggle('show', lvl>1); 
        const isL3A = (lvl===3 && isAdmin);
        document.getElementById('addProjBtn').style.display=isL3A?'block':'none';
        document.getElementById('restoreProjBtn').style.display=isL3A?'block':'none';
    }

    function createNewProject() { const title = prompt("Title:"); if(!title) return; const id = currentCat[0].toLowerCase() + Date.now(); portfolio_data[id] = { title, layout: [], thumbs: [] }; saveToCloud().then(() => renderProjGrid()); }
    
    // --- 优化的删除功能：强制同步，解决"删不掉"问题 ---
    async function deleteProject(id, title) { 
        if (prompt(`确定要永久删除 [ ${title} ] 吗？\n操作无法撤销。请输入项目名称确认:`) === title) { 
            delete portfolio_data[id]; 
            // 立即同步，防止假删除
            const btn = document.querySelector(`[onclick*="${id}"]`);
            if(btn) btn.style.opacity = '0.2';
            try {
                await saveToCloud(); 
                renderProjGrid(); 
                alert("项目已删除并同步。");
            } catch(e) { alert("同步失败: " + e.message); }
        } 
    }

    function openProject(id) { currentProj={id,...portfolio_data[id]}; showLevel(4); }
    function handleBack() { if (currentLvl === 4) { if(isAdmin) runAutoBackup("BackBtn"); showLevel(3); } else if (currentLvl === 3) showLevel(2); else showLevel(1); }
    function addText() { createMiroItem(`<div contenteditable="true" style="padding:20px; font-size:1.1rem; outline:none; font-weight:300;">New Text</div>`,'500px','500px','250px'); saveHistory(); }
    function checkUnlock() { const p=prompt("Pass:"); if(p==="li123"){const t=prompt("Token:"); if(t&&t.startsWith('ghp_')){localStorage.setItem('gh_token', t.trim()); isAdmin=true; document.getElementById('adminInfo').innerText="ADMIN ACTIVE"; showLevel(currentLvl);}}}
    function initParticles() { cvs.width=window.innerWidth; cvs.height=window.innerHeight; pts=Array.from({length:80},()=>new Particle()); }
    function animate() { ctx.clearRect(0,0,cvs.width,cvs.height); let px=m.smX, py=m.smY; m.smX+=(m.x-m.smX)*0.1; m.smY+=(m.y-m.smY)*0.1; m.vx=m.smX-px; m.vy=m.smY-py; pts.forEach(p=>p.update()); requestAnimationFrame(animate); }
    
    // --- 强制清理工具函数 (如果在页面无法删除，可在控制台运行此函数) ---
    window.forceCleanGhosts = async function() {
        if(!isAdmin) return alert("请先登录管理员");
        const ghosts = ["MIC-TREE", "MIC_TREE_1", "MIC_TREE_3"]; // 需要清理的名称
        let cleaned = 0;
        for(let k in portfolio_data) {
            if(ghosts.some(g => portfolio_data[k].title.includes(g) || k.includes(g))) {
                delete portfolio_data[k];
                cleaned++;
            }
        }
        if(cleaned > 0) { await saveToCloud(); renderProjGrid(); alert(`清理了 ${cleaned} 个幽灵项目`); }
        else alert("未发现匹配项目");
    };

    window.onload = () => { if(CONFIG.token) { isAdmin = true; document.getElementById('adminInfo').innerText="ADMIN ACTIVE"; } initParticles(); animate(); initSystem(); };
    window.onresize = () => { cvs.width=window.innerWidth; cvs.height=window.innerHeight; };
    document.getElementById('dynamicNav').innerHTML=['Architecture','Computational','Interest','Photo','Ongoing'].map(c=>`<a onclick="showLevel(3, '${c}')">${c}</a>`).join('');

    window.addEventListener('beforeunload', () => {
        if (isAdmin && currentLvl === 4 && currentProj) {
            const data = btoa(unescape(encodeURIComponent(JSON.stringify(portfolio_data[currentProj.id]))));
            fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.backupDir}/EXIT_${currentProj.id}_${Date.now()}.json`, {
                method: 'PUT', headers: { 'Authorization': `token ${CONFIG.token}` },
                body: JSON.stringify({ message: "Exit Backup", content: data }), keepalive: true
            });
        }
    });
</script>
