<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chenming LI | Neural Architecture Portfolio</title>
    <style>
        :root { --bg-blur: 0px; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #fff; font-family: "Helvetica Neue", sans-serif; overflow: hidden; touch-action: none; -webkit-font-smoothing: antialiased; }
        #canvas-container { position: fixed; width: 100%; height: 100%; z-index: 1; transition: filter 1s ease; filter: blur(var(--bg-blur)); pointer-events: none; }
        nav { position: fixed; top: 0; left: 0; width: 100%; padding: 40px 60px; display: flex; justify-content: space-between; align-items: center; z-index: 5000; box-sizing: border-box; opacity: 0; transform: translateY(-20px); transition: 0.8s ease; pointer-events: none; }
        nav.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .nav-logo { font-size: 0.9rem; font-weight: 600; letter-spacing: 2px; cursor: pointer; color: #000; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #999; font-size: 0.6rem; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .nav-links a:hover { color: #000; }
        #lvl1 h1 { font-size: 3.5rem; font-weight: 100; letter-spacing: 20px; margin-bottom: 20px; text-transform: uppercase; color: #000; }
        #lvl1 p { font-size: 0.55rem; color: #aaa; letter-spacing: 8px; text-transform: uppercase; margin-top: 0; }
        .neural-grid { display: flex; gap: 70px; justify-content: center; align-items: center; width: 95%; flex-wrap: wrap; padding: 20px; }
        .stack-container { position: relative; width: 160px; height: 220px; cursor: pointer; text-align: center; perspective: 1000px; }
        .neural-stack { position: relative; width: 140px; height: 140px; transform-style: preserve-3d; margin: 0 auto; transition: transform 0.6s; }
        .neural-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; border: 1px solid rgba(0,0,0,0.05); overflow: hidden; transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.02); display: flex; align-items: center; justify-content: center; }
        .neural-layer img { width: 100%; height: 100%; object-fit: cover; }
        .layer-1 { z-index: 5; }
        .layer-2 { z-index: 4; transform: translate(10px, -10px); opacity: 0.6; }
        .layer-3 { z-index: 3; transform: translate(20px, -20px); opacity: 0.3; }
        .stack-container:hover .layer-1 { transform: translate(-15px, 15px) rotate(-3deg); box-shadow: 15px 15px 30px rgba(0,0,0,0.1); }
        .stack-container:hover .layer-2 { transform: translate(5px, -5px); opacity: 0.8; }
        .stack-container:hover .layer-3 { transform: translate(22px, -22px); opacity: 0.5; }
        .stack-label { margin-top: 35px; font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: #bbb; transition: 0.4s; }
        .stack-container:hover .stack-label { color: #000; letter-spacing: 5px; }
        .delete-proj-btn { position: absolute; top: -10px; right: -10px; width: 24px; height: 24px; background: #ff4335; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; z-index: 100; opacity: 0; transition: 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .stack-container:hover .delete-proj-btn { opacity: 1; }
        .view-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; opacity: 0; visibility: hidden; transition: 0.8s cubic-bezier(0.165, 0.84, 0.44, 1); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .view-layer.active { opacity: 1; visibility: visible; }
        #lvl4 { background: #fbfbfb; z-index: 6000; display: none; }
        #miro-viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        .miro-item { position: absolute; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid transparent; user-select: none; }
        .miro-item.selected { border: 1px solid #4285F4; z-index: 1000 !important; }
        
        /* --- NEW TEXT CARD UI START --- */
        .card-header { position: absolute; top: 0; left: 0; width: 100%; height: 32px; background: #f8f9fa; border-bottom: 1px solid #eee; display: flex; justify-content: flex-end; align-items: center; padding: 0 10px; box-sizing: border-box; opacity: 0; transition: opacity 0.2s; z-index: 10; }
        .miro-item:hover .card-header { opacity: 1; }
        .drag-handle { margin-right: auto; font-size: 9px; color: #999; letter-spacing: 1px; cursor: move; font-weight: bold; }
        .edit-btn { font-size: 10px; font-weight: 600; color: #333; text-decoration: underline; cursor: pointer; text-transform: uppercase; margin-left: 10px; }
        .close-btn { color: #EA4335; margin-left: 12px; cursor: pointer; font-weight: bold; font-size: 12px; }

        .editor-toolbar { position: absolute; top: 0; left: 0; width: 100%; height: 40px; background: #fff; border-bottom: 1px solid #eee; display: none; align-items: center; padding: 0 10px; box-sizing: border-box; z-index: 20; }
        .miro-item.editing .editor-toolbar { display: flex; }
        .miro-item.editing .card-header { display: none !important; }
        .miro-item.editing { border: 1px solid #000; cursor: default !important; z-index: 2000 !important; }
        .tool-group { display: flex; gap: 8px; align-items: center; }
        .style-btn { font-size: 14px; cursor: pointer; background: none; border: none; color: #666; padding: 2px 6px; border-radius: 4px; }
        .style-btn:hover { background: #f0f0f0; color: #000; }
        .done-btn { margin-left: auto; background: #000; color: #fff; border: none; padding: 5px 12px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
        
        .editable-text { margin-top: 32px; height: calc(100% - 32px); padding: 15px; overflow-y: auto; outline: none; box-sizing: border-box; font-size: 14px; line-height: 1.6; color: #333; }
        .miro-item.editing .editable-text { margin-top: 40px; height: calc(100% - 40px); cursor: text; }
        /* --- NEW TEXT CARD UI END --- */

        .crop-container { width: 100%; height: 100%; overflow: hidden; position: relative; }
        .miro-item img, .miro-item video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
        .resize-handle { position: absolute; width: 12px; height: 12px; background: #4285F4; right: -6px; bottom: -6px; cursor: nwse-resize; display: none; z-index: 1001; border-radius: 50%; }
        .miro-item.selected .resize-handle { display: flex; }
        
        .miro-ui { position: fixed; bottom: 80px; left: 60px; z-index: 9000; display: flex; align-items: center; gap: 15px; }
        .ui-btn { background: #fff; padding: 12px 24px; border-radius: 40px; font-size: 0.6rem; letter-spacing: 1px; cursor: pointer; border: 1px solid #eee; text-transform: uppercase; transition: 0.3s; }
        .back-btn-container { position: fixed; bottom: 30px; left: 60px; z-index: 7001; opacity: 0; transform: translateY(10px); transition: 0.5s ease; pointer-events: none; }
        .back-btn-container.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .back-btn { font-size: 0.55rem; letter-spacing: 3px; color: #999; cursor: pointer; text-transform: uppercase; padding: 10px; }
        #loading-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .admin-lock { position: fixed; bottom: 30px; right: 60px; font-size: 0.45rem; color: #ccc; cursor: pointer; z-index: 8000; letter-spacing: 2px; }
        #selection-box { position: fixed; border: 1px solid #4285F4; background: rgba(66, 133, 244, 0.1); z-index: 10000; pointer-events: none; display: none; }
        #global-upload-list { position: fixed; bottom: 100px; right: 30px; width: 240px; z-index: 9999; pointer-events: none; }
    </style>
</head>
<body>

<div id="loading-screen"><div style="width: 100px; height: 1px; background: #eee; position: relative; overflow: hidden;"><div id="loading-bar" style="width: 0%; height: 100%; background: #000; transition: 0.3s;"></div></div></div>
<div id="global-upload-list"></div>
<div id="selection-box"></div>
<div id="canvas-container"><canvas id="particleCanvas"></canvas></div>
<nav id="mainNav"><div class="nav-logo" onclick="showLevel(1)">CHENMING</div><div id="dynamicNav" class="nav-links"></div></nav>
<div id="backBtnContainer" class="back-btn-container">
    <div id="addProjBtn" class="back-btn" style="display:none; color: #34A853; margin-bottom:10px;" onclick="createNewProject()">+ NEW PROJECT</div>
    <div class="back-btn" onclick="handleBack()">← BACK</div>
</div>

<div id="lvl1" class="view-layer active"><div onclick="showLevel(2)" style="cursor:pointer; text-align:center"><h1>CHENMING LI</h1><p>Architecture & Computation Portfolio</p></div></div>
<div id="lvl2" class="view-layer"><div class="neural-grid" id="catGrid"></div></div>
<div id="lvl3" class="view-layer"><div class="neural-grid" id="projGrid"></div></div>
<div id="lvl4" class="view-layer">
    <div class="lvl4-header" style="position: fixed; top: 100px; left: 60px; z-index: 7000; pointer-events: none;">
        <div id="lvl4CatTag" style="font-size: 0.45rem; color: #ccc; letter-spacing: 4px; margin-bottom: 8px;">CATEGORY</div>
        <div id="lvl4Title" style="pointer-events: auto; outline:none; font-size: 1.5rem; font-weight: 200;" contenteditable="false" onblur="saveToCloud()">PROJECT TITLE</div>
    </div>
    <div id="miro-viewport"></div>
    <div class="miro-ui" id="adminControls" style="display:none;">
        <button class="ui-btn" onclick="document.getElementById('fileInput').click()">+ MEDIA</button>
        <button class="ui-btn" onclick="addLink()">+ LINK</button>
        <button class="ui-btn" onclick="addText()">+ TEXT</button>
        <button class="ui-btn" id="manualSaveBtn" style="background: #000; color: #fff; border: none;" onclick="manualSaveWithBackup()">SAVE & BACKUP</button>
    </div>
    <input type="file" id="fileInput" hidden multiple onchange="handleUpload(event)">
</div>
<div class="admin-lock" onclick="checkUnlock()" id="adminInfo">ADMIN LOGIN</div>

<script>
    const CONFIG = {
        owner: 'chenming-ctrl', repo: 'my-portfolio-data', path: 'portfolio_data.json',
        get token() { return (localStorage.getItem('gh_token') || '').trim(); }
    };

    function getAssetUrl(rawUrl) {
        if (!rawUrl || !rawUrl.includes('github.com')) return rawUrl;
        return rawUrl.replace('raw.githubusercontent.com', 'cdn.jsdelivr.net/gh').replace('github.com', 'cdn.jsdelivr.net/gh').replace('/blob/main/', '@main/').replace('/main/', '@main/');
    }

    let portfolio_data = {}, isAdmin = false, currentLvl = 1, currentCat = '', currentProj = null;
    let zoom = 1, panX = 0, panY = 0, isPanning = false, isDragging = false, isResizing = false, isSelecting = false;
    let dragTarget = null, startX, startY, startW, selectedItems = [];
    let historyStack = [];
    let isSaving = false, savePending = false; 
    const vp = document.getElementById('miro-viewport'), bd = document.getElementById('lvl4'), sbox = document.getElementById('selection-box');

    // --- NEW HELPER FUNCTIONS ---
    function formatDoc(cmd, val=null) { document.execCommand(cmd, false, val); }
    
    function finishEditing() {
        document.querySelectorAll('.miro-item.editing').forEach(el => {
            const txt = el.querySelector('.editable-text');
            if(txt) { txt.contentEditable = "false"; txt.blur(); }
            el.classList.remove('editing');
        });
        saveToCloud();
    }

    function enterEditMode(btn) {
        finishEditing();
        const item = btn.closest('.miro-item');
        item.classList.add('editing');
        const txt = item.querySelector('.editable-text');
        txt.contentEditable = "true";
        txt.focus();
    }

    function deleteItem(btn) {
        if(confirm("Delete this element?")) { btn.closest('.miro-item').remove(); saveToCloud(); }
    }

    async function initSystem() {
        const apiUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`;
        try {
            const headers = CONFIG.token ? {'Authorization': `token ${CONFIG.token}`} : {};
            const res = await fetch(`${apiUrl}?t=${Date.now()}`, { headers });
            if (res.ok) {
                const json = await res.json();
                portfolio_data = JSON.parse(decodeURIComponent(escape(atob(json.content))));
            }
        } catch(e) {}
        document.getElementById('loading-bar').style.width = "100%";
        setTimeout(() => { document.getElementById('loading-screen').style.display = "none"; if(currentLvl === 2) renderCatGrid(); }, 500);
    }

    async function saveToCloud() { 
        if(!isAdmin || !CONFIG.token) return; 
        if (isSaving) { savePending = true; return; }
        isSaving = true;
        try {
            if(currentLvl === 4 && currentProj) {
                const items = Array.from(vp.children).filter(el => el.classList.contains('miro-item')).map(el => ({
                    html: el.querySelector('.crop-container') ? el.querySelector('.crop-container').innerHTML : el.innerHTML, 
                    x: el.style.left, y: el.style.top, w: el.style.width, h: el.style.height
                })); 
                portfolio_data[currentProj.id].layout = items; 
                portfolio_data[currentProj.id].title = document.getElementById('lvl4Title').innerText; 
            }
            const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`; 
            const getSha = await fetch(`${url}?t=${Date.now()}`, { headers: {'Authorization': `token ${CONFIG.token}`} }); 
            const sha = (await getSha.json()).sha; 
            await fetch(url, {
                method: 'PUT', headers: {'Authorization': `token ${CONFIG.token}`}, 
                body: JSON.stringify({ message: "Sync Data", content: btoa(unescape(encodeURIComponent(JSON.stringify(portfolio_data, null, 2)))), sha })
            }); 
        } catch (e) {}
        isSaving = false;
        if (savePending) { savePending = false; saveToCloud(); }
    }

    function createMiroItem(content, x, y, w = "300px", h = "auto") {
        const d = document.createElement('div');
        d.className = 'miro-item'; d.style.cssText = `left:${x}; top:${y}; width:${w}; height:${h};`;
        
        // 判断是否是文本卡片（带Header）还是普通媒体
        if(content.includes('card-header')) {
            d.innerHTML = content + `<div class="resize-handle"></div>`;
        } else {
            d.innerHTML = `<div class="crop-container">${content.replace(/src="([^"]+)"/g, (m, p1) => `src="${getAssetUrl(p1)}"`)}</div><div class="resize-handle"></div>`;
        }
        
        d.onmousedown = (e) => {
            if(!isAdmin || d.classList.contains('editing')) { if(d.classList.contains('editing')) e.stopPropagation(); return; }
            
            // 文本卡片限制：必须点击把手才能移动
            const isText = d.querySelector('.card-header');
            const isHandle = e.target.classList.contains('drag-handle') || e.target.closest('.drag-handle');
            if(isText && !isHandle) { e.stopPropagation(); return; }

            e.stopPropagation(); 
            if(!e.shiftKey && !d.classList.contains('selected')) {
                document.querySelectorAll('.miro-item').forEach(el => el.classList.remove('selected'));
                selectedItems = [];
            }
            d.classList.add('selected'); 
            if(!selectedItems.includes(d)) selectedItems.push(d);
            vp.appendChild(d); isDragging = true; dragTarget = d;
            startX = (e.clientX/zoom) - parseInt(d.style.left); startY = (e.clientY/zoom) - parseInt(d.style.top);
        };
        
        const rh = d.querySelector('.resize-handle');
        if(rh) rh.onmousedown = (e) => { e.stopPropagation(); isResizing = true; dragTarget = d; startW = parseInt(d.style.width); startX = e.clientX; };
        vp.appendChild(d); return d;
    }

    function addText() {
        const dx = (window.innerWidth/2 - panX)/zoom;
        const dy = (window.innerHeight/2 - panY)/zoom;
        const content = `
            <div class="card-header">
                <div class="drag-handle">✥ DRAG</div>
                <div class="edit-btn" onclick="enterEditMode(this)">EDIT</div>
                <div class="close-btn" onclick="deleteItem(this)">✕</div>
            </div>
            <div class="editor-toolbar" onmousedown="event.preventDefault()">
                <div class="tool-group">
                    <button class="style-btn" onclick="formatDoc('bold')"><b>B</b></button>
                    <button class="style-btn" onclick="formatDoc('italic')"><i>I</i></button>
                    <button class="style-btn" onclick="formatDoc('formatBlock','H3')">H</button>
                    <div style="width:1px;height:12px;background:#ddd"></div>
                    <button class="style-btn" onclick="formatDoc('justifyLeft')">≡</button>
                    <button class="style-btn" onclick="formatDoc('justifyCenter')">≛</button>
                </div>
                <button class="done-btn" onclick="finishEditing()">FINISH</button>
            </div>
            <div class="editable-text" contenteditable="false">New Text Block...</div>`;
        const item = createMiroItem(content, dx+'px', dy+'px', '320px', '200px');
        enterEditMode(item.querySelector('.edit-btn'));
    }

    bd.onmousedown = (e) => {
        if(currentLvl === 4) {
            const isBlank = e.target === bd || e.target === vp;
            if(isBlank) finishEditing();
            if (isBlank && e.button === 0 && isAdmin) {
                isSelecting = true; startX = e.clientX; startY = e.clientY;
                sbox.style.cssText = `display:block; left:${startX}px; top:${startY}px; width:0; height:0;`;
                document.querySelectorAll('.miro-item').forEach(el => el.classList.remove('selected'));
                selectedItems = [];
            } else if (e.button === 1 || (isBlank && e.button === 0 && !isAdmin)) {
                isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY;
            }
        }
    };

    window.onmousemove = (e) => {
        if(isSelecting) {
            const curX = e.clientX, curY = e.clientY;
            const l = Math.min(startX, curX), t = Math.min(startY, curY), w = Math.abs(curX - startX), h = Math.abs(curY - startY);
            sbox.style.left = l + 'px'; sbox.style.top = t + 'px'; sbox.style.width = w + 'px'; sbox.style.height = h + 'px';
            document.querySelectorAll('.miro-item').forEach(item => {
                const r = item.getBoundingClientRect();
                if (r.left < l+w && r.left+r.width > l && r.top < t+h && r.top+r.height > t) item.classList.add('selected');
                else item.classList.remove('selected');
            });
        }
        else if(isPanning) { panX = e.clientX - startX; panY = e.clientY - startY; updateViewport(); }
        else if(isDragging && dragTarget) {
            let nX = (e.clientX/zoom) - startX, nY = (e.clientY/zoom) - startY;
            const diffX = nX - parseInt(dragTarget.style.left), diffY = nY - parseInt(dragTarget.style.top);
            if (selectedItems.includes(dragTarget)) {
                selectedItems.forEach(el => { el.style.left = (parseInt(el.style.left) + diffX) + "px"; el.style.top = (parseInt(el.style.top) + diffY) + "px"; });
            } else { dragTarget.style.left = nX + "px"; dragTarget.style.top = nY + "px"; }
        } else if(isResizing && dragTarget) { 
            dragTarget.style.width = Math.max(50, startW + (e.clientX - startX)/zoom) + "px"; 
        }
    };

    window.onmouseup = () => { if(isSelecting) { selectedItems = Array.from(document.querySelectorAll('.miro-item.selected')); sbox.style.display = 'none'; } if(isDragging || isResizing) saveToCloud(); isDragging = isResizing = isPanning = isSelecting = false; };
    bd.addEventListener('wheel', e => { if(currentLvl === 4) { e.preventDefault(); const f = Math.pow(1.1, -e.deltaY/120); const nz = Math.min(Math.max(zoom * f, 0.05), 5); panX = e.clientX - (e.clientX - panX) * (nz/zoom); panY = e.clientY - (e.clientY - panY) * (nz/zoom); zoom = nz; updateViewport(); } }, {passive:false});
    function updateViewport() { vp.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`; }

    function showLevel(lvl, cat = '') {
        currentLvl=lvl; if(cat)currentCat=cat; 
        document.querySelectorAll('.view-layer').forEach(el=>el.classList.remove('active')); 
        document.getElementById('lvl4').style.display=(lvl===4)?'flex':'none'; 
        if(lvl===2)renderCatGrid(); if(lvl===3)renderProjGrid(); 
        if(lvl===4){
            vp.innerHTML = '';
            const p = portfolio_data[currentProj.id];
            (p.layout||[]).forEach(it=>createMiroItem(it.html,it.x,it.y,it.w,it.h)); 
            document.getElementById('lvl4Title').innerText=p.title; 
            document.getElementById('lvl4Title').contentEditable = isAdmin;
            document.getElementById('lvl4CatTag').innerText=currentCat;
            document.getElementById('adminControls').style.display = isAdmin ? 'flex' : 'none';
        }
        document.getElementById('lvl'+lvl).classList.add('active'); 
        document.documentElement.style.setProperty('--bg-blur', [0,15,30,0][lvl-1]+'px'); 
        document.getElementById('mainNav').classList.toggle('visible', lvl>1); 
        document.getElementById('backBtnContainer').classList.toggle('show', lvl>1); 
        document.getElementById('addProjBtn').style.display=(lvl===3 && isAdmin)?'block':'none';
    }

    // 基础功能
    async function manualSaveWithBackup() { await saveToCloud(); alert("Saved!"); }
    function renderCatGrid() { const cats=['Architecture','Computational','Interest','Photo','Ongoing']; document.getElementById('catGrid').innerHTML=cats.map(cat=>{const ps=Object.keys(portfolio_data).filter(id=>id.startsWith(cat[0].toLowerCase())); const t=(ps.length&&portfolio_data[ps[0]].thumbs)?getAssetUrl(portfolio_data[ps[0]].thumbs[0]):''; return `<div class="stack-container" onclick="showLevel(3, '${cat}')"><div class="neural-stack"><div class="neural-layer layer-1">${t?`<img src="${t}">`:''}</div></div><div class="stack-label">${cat}</div></div>`;}).join(''); }
    function renderProjGrid() { const ps=Object.keys(portfolio_data).filter(id=>id.startsWith(currentCat[0].toLowerCase())).map(id=>({id,...portfolio_data[id]})); document.getElementById('projGrid').innerHTML=ps.map(p=>`<div class="stack-container" onclick="openProject('${p.id}')"><div class="neural-stack"><div class="neural-layer layer-1"></div></div><div class="stack-label">${p.title}</div></div>`).join(''); }
    function createNewProject() { const title = prompt("Title:"); if(!title) return; const id = currentCat[0].toLowerCase() + Date.now(); portfolio_data[id] = { title, layout: [], thumbs: [] }; saveToCloud().then(() => renderProjGrid()); }
    function openProject(id) { currentProj={id,...portfolio_data[id]}; showLevel(4); }
    function handleBack() { if (currentLvl === 4) showLevel(3); else if (currentLvl === 3) showLevel(2); else showLevel(1); }
    function checkUnlock() { const p=prompt("Pass:"); if(p==="li123"){const t=prompt("Token:"); if(t){localStorage.setItem('gh_token', t.trim()); isAdmin=true; location.reload();}}}
    
    // 背景粒子
    const cvs = document.getElementById('particleCanvas'), ctx = cvs.getContext('2d');
    let pts = [], m = { x: 0, y: 0 };
    window.addEventListener('mousemove', ev => { m.x = ev.clientX; m.y = ev.clientY; });
    class Particle {
        constructor() { this.x = Math.random()*cvs.width; this.y = Math.random()*cvs.height; this.v = {x:(Math.random()-0.5)*0.5, y:(Math.random()-0.5)*0.5}; }
        update() { this.x+=this.v.x; this.y+=this.v.y; if(this.x<0||this.x>cvs.width)this.v.x*=-1; if(this.y<0||this.y>cvs.height)this.v.y*=-1; ctx.beginPath(); ctx.arc(this.x,this.y,2,0,Math.PI*2); ctx.fillStyle='rgba(0,0,0,0.1)'; ctx.fill(); }
    }
    function initParticles() { cvs.width=window.innerWidth; cvs.height=window.innerHeight; pts=Array.from({length:50},()=>new Particle()); }
    function animate() { ctx.clearRect(0,0,cvs.width,cvs.height); pts.forEach(p=>p.update()); requestAnimationFrame(animate); }
    
    window.onload = () => { if(CONFIG.token) { isAdmin = true; document.getElementById('adminInfo').innerText="ADMIN ACTIVE"; } initParticles(); animate(); initSystem(); };
    document.getElementById('dynamicNav').innerHTML=['Architecture','Computational','Interest','Photo','Ongoing'].map(c=>`<a onclick="showLevel(3, '${c}')">${c}</a>`).join('');
</script>
</body>
</html>
