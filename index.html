<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chenming LI | Neural Architecture Portfolio</title>
    <style>
        :root { --bg-blur: 0px; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #fff; font-family: "Helvetica Neue", sans-serif; overflow: hidden; touch-action: none; -webkit-font-smoothing: antialiased; }
        #canvas-container { position: fixed; width: 100%; height: 100%; z-index: 1; transition: filter 1s ease; filter: blur(var(--bg-blur)); pointer-events: none; }
        nav { position: fixed; top: 0; left: 0; width: 100%; padding: 40px 60px; display: flex; justify-content: space-between; align-items: center; z-index: 5000; box-sizing: border-box; opacity: 0; transform: translateY(-20px); transition: 0.8s ease; pointer-events: none; }
        nav.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .nav-logo { font-size: 0.9rem; font-weight: 600; letter-spacing: 2px; cursor: pointer; color: #000; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #999; font-size: 0.6rem; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .nav-links a:hover { color: #000; }
        #lvl1 h1 { font-size: 3.5rem; font-weight: 100; letter-spacing: 20px; margin-bottom: 20px; text-transform: uppercase; color: #000; }
        #lvl1 p { font-size: 0.55rem; color: #aaa; letter-spacing: 8px; text-transform: uppercase; margin-top: 0; }
        .neural-grid { display: flex; gap: 70px; justify-content: center; align-items: center; width: 95%; flex-wrap: wrap; padding: 20px; }
        .stack-container { position: relative; width: 160px; height: 220px; cursor: pointer; text-align: center; perspective: 1000px; }
        .neural-stack { position: relative; width: 140px; height: 140px; transform-style: preserve-3d; margin: 0 auto; transition: transform 0.6s; }
        .neural-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; border: 1px solid rgba(0,0,0,0.05); overflow: hidden; transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.02); display: flex; align-items: center; justify-content: center; }
        .neural-layer img { width: 100%; height: 100%; object-fit: cover; }
        .layer-1 { z-index: 5; }
        .layer-2 { z-index: 4; transform: translate(10px, -10px); opacity: 0.6; }
        .layer-3 { z-index: 3; transform: translate(20px, -20px); opacity: 0.3; }
        .stack-container:hover .layer-1 { transform: translate(-15px, 15px) rotate(-3deg); box-shadow: 15px 15px 30px rgba(0,0,0,0.1); }
        .stack-container:hover .layer-2 { transform: translate(5px, -5px); opacity: 0.8; }
        .stack-container:hover .layer-3 { transform: translate(22px, -22px); opacity: 0.5; }
        .stack-label { margin-top: 35px; font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: #bbb; transition: 0.4s; }
        .stack-container:hover .stack-label { color: #000; letter-spacing: 5px; }
        .delete-proj-btn { position: absolute; top: -10px; right: -10px; width: 24px; height: 24px; background: #ff4335; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; z-index: 100; opacity: 0; transition: 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .stack-container:hover .delete-proj-btn { opacity: 1; }

        .view-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; opacity: 0; visibility: hidden; transition: 0.8s cubic-bezier(0.165, 0.84, 0.44, 1); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .view-layer.active { opacity: 1; visibility: visible; }
        #lvl4 { background: #fbfbfb; z-index: 6000; display: none; }
        #miro-viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; }
        
        /* 文字卡片与编辑状态 */
        .miro-item { position: absolute; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 2px solid transparent; user-select: none; }
        .miro-item.text-item { background: #f4f4f4; }
        .miro-item.selected { border: 2px solid #4285F4; z-index: 1000 !important; }
        .miro-item.is-editing { background: #fff !important; cursor: text !important; user-select: text !important; box-shadow: 0 0 0 2px #4285F4; }
        .miro-item.is-editing .crop-container { pointer-events: auto !important; }

        .crop-container { width: 100%; height: 100%; overflow: hidden; position: relative; }
        .miro-item img, .miro-item video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
        .resize-handle { position: absolute; width: 12px; height: 12px; background: #4285F4; right: -6px; bottom: -6px; cursor: nwse-resize; display: none; z-index: 1001; border-radius: 50%; }
        .miro-item.selected .resize-handle { display: flex; }
        
        /* 增强型参考线与框选 */
        .guide-line { position: absolute; background: rgba(66, 133, 244, 0.4); pointer-events: none; z-index: 5000; display: none; }
        #guide-x { width: 1px; height: 20000px; top: -10000px; border-left: 1px dashed #4285F4; }
        #guide-y { height: 1px; width: 20000px; left: -10000px; border-top: 1px dashed #4285F4; }
        #selection-box { position: absolute; border: 1px dashed #4285F4; background: rgba(66, 133, 244, 0.1); pointer-events: none; display: none; z-index: 9999; }

        /* 保存与任务状态栏 */
        #save-progress-bar { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: #eee; z-index: 10000; display: none; }
        #save-progress-inner { width: 0%; height: 100%; background: #34A853; transition: 0.3s; }
        #save-status-text { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 6px 18px; border-radius: 20px; font-size: 10px; z-index: 10000; display: none; letter-spacing: 1px; text-transform: uppercase; font-weight: bold; }

        .miro-ui { position: fixed; z-index: 9000; display: flex; align-items: center; gap: 12px; }
        .ui-btn { background: #fff; padding: 10px 20px; border-radius: 40px; font-size: 0.6rem; letter-spacing: 1px; cursor: pointer; border: 1px solid #eee; text-transform: uppercase; transition: 0.3s; }
        .ui-btn:hover { background: #f8f8f8; transform: translateY(-2px); }
        .back-btn-container { position: fixed; bottom: 30px; left: 60px; z-index: 7001; opacity: 0; transform: translateY(10px); transition: 0.5s ease; pointer-events: none; }
        .back-btn-container.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .back-btn { font-size: 0.55rem; letter-spacing: 3px; color: #999; cursor: pointer; text-transform: uppercase; padding: 10px; }
        #global-upload-list { position: fixed; bottom: 100px; right: 30px; width: 240px; z-index: 9999; pointer-events: none; }
        #loading-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .admin-lock { position: fixed; bottom: 30px; right: 60px; font-size: 0.45rem; color: #ccc; cursor: pointer; z-index: 8000; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="loading-screen">
    <div style="width: 100px; height: 1px; background: #eee; position: relative; overflow: hidden;"><div id="loading-bar" style="width: 0%; height: 100%; background: #000; transition: 0.3s;"></div></div>
</div>

<div id="save-progress-bar"><div id="save-progress-inner"></div></div>
<div id="save-status-text">READY</div>
<div id="selection-box"></div>

<div id="global-upload-list"></div>
<div id="canvas-container"><canvas id="particleCanvas"></canvas></div>
<nav id="mainNav"><div class="nav-logo" onclick="showLevel(1)">CHENMING</div><div id="dynamicNav" class="nav-links"></div></nav>
<div id="backBtnContainer" class="back-btn-container">
    <div id="addProjBtn" class="back-btn" style="display:none; color: #34A853; margin-bottom:10px;" onclick="createNewProject()">+ NEW PROJECT</div>
    <div class="back-btn" onclick="handleBack()">← BACK</div>
</div>

<div class="view-layer active" id="lvl1">
    <div onclick="showLevel(2)" style="cursor:pointer; text-align:center"><h1>CHENMING LI</h1><p>Architecture & Computation Portfolio</p></div>
</div>
<div id="lvl2" class="view-layer"><div class="neural-grid" id="catGrid"></div></div>
<div id="lvl3" class="view-layer">
    <div class="neural-grid" id="projGrid"></div>
    <div class="miro-ui" id="lvl3AdminControls" style="display:none; bottom: 80px; left: 60px;">
        <button class="ui-btn" style="background: #FBBC05; color: white; border: none;" onclick="scanBackups(true)">♻️ RESTORE DELETED</button>
    </div>
</div>
<div id="lvl4" class="view-layer">
    <div class="lvl4-header" style="position: fixed; top: 100px; left: 60px; z-index: 7000; pointer-events: none;">
        <div id="lvl4CatTag" style="font-size: 0.45rem; color: #ccc; letter-spacing: 4px; margin-bottom: 8px;">CATEGORY</div>
        <div id="lvl4Title" style="pointer-events: auto; outline:none; font-size: 1.5rem; font-weight: 200;" contenteditable="true" onblur="saveToCloud()">PROJECT TITLE</div>
    </div>
    <div id="miro-viewport">
        <div id="guide-x" class="guide-line"></div>
        <div id="guide-y" class="guide-line"></div>
    </div>
    <div class="miro-ui" id="adminControls" style="display:none; bottom: 80px; left: 60px;">
        <button class="ui-btn" onclick="document.getElementById('fileInput').click()">+ MEDIA</button>
        <button class="ui-btn" onclick="addLink()">+ LINK</button>
        <button class="ui-btn" onclick="addText()">+ TEXT</button>
        <button class="ui-btn" style="background: #FBBC05; color: white; border: none;" onclick="scanBackups(false)">♻️ RESTORE VER.</button>
        <button class="ui-btn" style="background: #34A853; color: white; border: none;" onclick="manualSave()">SAVE PROJECT</button>
    </div>
    <input type="file" id="fileInput" hidden multiple onchange="handleUpload(event)">
</div>
<div class="admin-lock" onclick="checkUnlock()" id="adminInfo">ADMIN LOGIN</div>

<script>
    const CONFIG = {
        owner: 'chenming-ctrl', repo: 'my-portfolio-data', path: 'portfolio_data.json',
        get token() { return (localStorage.getItem('gh_token') || '').trim(); }
    };

    let portfolio_data = {}, isAdmin = false, currentLvl = 1, currentCat = '', currentProj = null;
    let zoom = 1, panX = 0, panY = 0, isPanning = false, isDragging = false, isResizing = false, isSelecting = false;
    let selectStartX, selectStartY, dragTarget = null, startX, startY, startW;
    let historyStack = [];
    let isSaving = false, savePending = false;
    const vp = document.getElementById('miro-viewport'), bd = document.getElementById('lvl4');

    // 增强吸附逻辑：10px, 50px, 100px
    const SNAP_THRESHOLD = 10;
    function getSnappedPos(target, nx, ny) {
        let sx = nx, sy = ny;
        const tw = target.offsetWidth, th = target.offsetHeight;
        const others = Array.from(vp.children).filter(i => i !== target && i.classList.contains('miro-item'));
        const gaps = [0, 10, 50, 100];

        others.forEach(i => {
            const ix = parseInt(i.style.left), iy = parseInt(i.style.top), iw = i.offsetWidth, ih = i.offsetHeight;
            gaps.forEach(gap => {
                if (Math.abs(nx - (ix + iw + gap)) < SNAP_THRESHOLD) sx = ix + iw + gap;
                if (Math.abs((nx + tw) - (ix - gap)) < SNAP_THRESHOLD) sx = ix - tw - gap;
                if (Math.abs(nx - ix) < SNAP_THRESHOLD) sx = ix;
                if (Math.abs(ny - (iy + ih + gap)) < SNAP_THRESHOLD) sy = iy + ih + gap;
                if (Math.abs((ny + th) - (iy - gap)) < SNAP_THRESHOLD) sy = iy - th - gap;
                if (Math.abs(ny - iy) < SNAP_THRESHOLD) sy = iy;
            });
        });
        return {x: sx, y: sy};
    }

    async function saveToCloud() { 
        if(!isAdmin) return; 
        if (isSaving) { savePending = true; return; }
        isSaving = true;
        try {
            if(currentLvl === 4 && currentProj) {
                const items = Array.from(vp.children).filter(el => el.classList.contains('miro-item')).map(el => ({
                    html: el.querySelector('.crop-container').innerHTML, 
                    x: el.style.left, y: el.style.top, w: el.style.width, h: el.style.height
                })); 
                portfolio_data[currentProj.id].layout = items; 
                portfolio_data[currentProj.id].title = document.getElementById('lvl4Title').innerText; 
                portfolio_data[currentProj.id].thumbs = items.filter(it => it.html.includes('<img')).slice(0,3).map(it => it.html.match(/src="([^"]+)"/)?.[1]);
            }
            const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`; 
            const getSha = await fetch(url + "?t=" + Date.now(), { headers: {'Authorization': `token ${CONFIG.token}`} }); 
            const sha = (await getSha.json()).sha; 
            await fetch(url, {
                method: 'PUT', headers: {'Authorization': `token ${CONFIG.token}`}, 
                body: JSON.stringify({ message: "Sync Portfolio", content: btoa(unescape(encodeURIComponent(JSON.stringify(portfolio_data, null, 2)))), sha })
            }); 
        } catch (e) { console.error("Cloud Save Error:", e); }
        isSaving = false;
        if (savePending) { savePending = false; saveToCloud(); }
    }

    // 任务状态显示与备份循环管理
    async function manualSave() {
        if(!isAdmin || !currentProj) return;
        const statusText = document.getElementById('save-status-text');
        const progressBar = document.getElementById('save-progress-bar');
        const progressInner = document.getElementById('save-progress-inner');

        const updateStatus = (text, percent) => {
            statusText.innerText = text; statusText.style.display = 'block';
            progressBar.style.display = 'block'; progressInner.style.width = percent + '%';
        };

        try {
            updateStatus("Step 1/3: PACKAGING DATA...", 30);
            await saveToCloud();
            
            updateStatus("Step 2/3: ANALYZING BACKUPS...", 60);
            const repoUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/backups`;
            const listRes = await fetch(repoUrl, { headers: {'Authorization': `token ${CONFIG.token}`} });
            let backups = [];
            if (listRes.ok) backups = await listRes.json();

            const prefix = `${currentProj.title.replace(/\s+/g, '_')}_`;
            const projectBackups = backups.filter(f => f.name.startsWith(prefix)).sort((a, b) => a.name.localeCompare(b.name));

            if (projectBackups.length >= 5) {
                const oldest = projectBackups[0];
                await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/backups/${oldest.name}`, {
                    method: 'DELETE', headers: {'Authorization': `token ${CONFIG.token}`},
                    body: JSON.stringify({ message: "Rolling cleanup", sha: oldest.sha })
                });
            }

            updateStatus("Step 3/3: CREATING VERSION...", 90);
            const newBackupName = `backups/${prefix}${Date.now()}.json`;
            const backupPayload = { projectId: currentProj.id, title: currentProj.title, layout: portfolio_data[currentProj.id].layout };
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(backupPayload, null, 2))));
            await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${newBackupName}`, {
                method: 'PUT', headers: {'Authorization': `token ${CONFIG.token}`},
                body: JSON.stringify({ message: `Backup: ${currentProj.title}`, content: content })
            });

            updateStatus("ALL SAVED SUCCESSFULLY!", 100);
            setTimeout(() => { statusText.style.display = progressBar.style.display = 'none'; }, 3000);
        } catch (e) {
            updateStatus("SAVE ERROR!", 0);
            console.error(e);
        }
    }

    // 恢复备份扫描逻辑
    async function scanBackups(isLvl3Mode) {
        if (!isAdmin) return;
        const statusText = document.getElementById('save-status-text');
        statusText.innerText = "SCANNING REPOSITORY...";
        statusText.style.display = 'block';
        
        try {
            const repoUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/backups`;
            const res = await fetch(repoUrl, { headers: {'Authorization': `token ${CONFIG.token}`} });
            if (!res.ok) throw new Error("No backups found");
            const allFiles = await res.json();
            let matches = [];

            if (isLvl3Mode) {
                const catPrefix = currentCat[0].toLowerCase();
                matches = allFiles.filter(f => f.name.toLowerCase().startsWith(catPrefix));
            } else {
                const projPrefix = `${currentProj.title.replace(/\s+/g, '_')}_`;
                matches = allFiles.filter(f => f.name.startsWith(projPrefix));
            }

            if (matches.length === 0) { alert("No backups found for this context."); return; }

            const options = matches.reverse().slice(0, 10).map((f, i) => `${i + 1}. ${f.name}`).join('\n');
            const choice = prompt(`Select backup to RESTORE (1-${Math.min(10, matches.length)}):\n\n${options}`);
            if (!choice || isNaN(choice)) return;

            const selectedFile = matches[parseInt(choice) - 1];
            const fileRes = await fetch(selectedFile.download_url);
            const backupData = await fileRes.json();

            if (isLvl3Mode) {
                if (!portfolio_data[backupData.projectId]) {
                    if (confirm(`Recover deleted project "${backupData.title}"?`)) {
                        portfolio_data[backupData.projectId] = { title: backupData.title, layout: backupData.layout, thumbs: [] };
                        await saveToCloud(); renderProjGrid();
                    }
                } else { alert("Project exists. Use restore inside project."); }
            } else {
                if (confirm("Overwrite current layout with this version?")) {
                    portfolio_data[currentProj.id].layout = backupData.layout;
                    showLevel(4);
                }
            }
        } catch (e) { alert("Restore Error: " + e.message); }
        finally { statusText.style.display = 'none'; }
    }

    function createMiroItem(content, x, y, w = "300px", h = "auto") {
        const d = document.createElement('div');
        const isText = content.includes('text-editor');
        d.className = `miro-item ${isText ? 'text-item' : ''}`; 
        d.style.cssText = `left:${x}; top:${y}; width:${w}; height:${h};`;
        d.innerHTML = `<div class="crop-container">${content}</div><div class="resize-handle"></div>`;
        const edit = d.querySelector('[contenteditable]');
        
        d.onmousedown = (e) => {
            if (d.classList.contains('is-editing')) return;
            if(!isAdmin || e.button !== 0) return;
            e.stopPropagation();
            if(!e.shiftKey) document.querySelectorAll('.miro-item').forEach(el => el.classList.remove('selected'));
            d.classList.add('selected'); vp.appendChild(d);
            isDragging = true; dragTarget = d;
            startX = (e.clientX/zoom) - parseInt(d.style.left);
            startY = (e.clientY/zoom) - parseInt(d.style.top);
        };
        if(edit) { 
            d.ondblclick = (e) => { 
                if(!isAdmin) return; e.stopPropagation(); 
                d.classList.add('is-editing'); edit.focus(); 
                document.execCommand('selectAll', false, null);
            }; 
            edit.onblur = () => { d.classList.remove('is-editing'); saveToCloud(); }; 
        }
        vp.appendChild(d); return d;
    }

    window.onmousemove = (e) => {
        if(isPanning) { panX = e.clientX - startX; panY = e.clientY - startY; updateViewport(); }
        else if(isSelecting) {
            const curX = (e.clientX - panX) / zoom, curY = (e.clientY - panY) / zoom;
            const box = document.getElementById('selection-box');
            const left = Math.min(curX, selectStartX), top = Math.min(curY, selectStartY);
            const width = Math.abs(curX - selectStartX), height = Math.abs(curY - selectStartY);
            box.style.left = left + 'px'; box.style.top = top + 'px';
            box.style.width = width + 'px'; box.style.height = height + 'px';
            document.querySelectorAll('.miro-item').forEach(item => {
                const ix = parseInt(item.style.left), iy = parseInt(item.style.top);
                if (ix > left && ix < left+width && iy > top && iy < top+height) item.classList.add('selected');
            });
        }
        else if(isDragging && dragTarget && !isResizing) {
            let rx = (e.clientX/zoom) - startX, ry = (e.clientY/zoom) - startY;
            const sn = getSnappedPos(dragTarget, rx, ry);
            dragTarget.style.left = sn.x + "px"; dragTarget.style.top = sn.y + "px";
            const gx = document.getElementById('guide-x'), gy = document.getElementById('guide-y');
            gx.style.display = gy.style.display = 'block';
            gx.style.left = dragTarget.style.left; gy.style.top = dragTarget.style.top;
        } else if(isResizing && dragTarget) {
            dragTarget.style.width = Math.max(50, startW + (e.clientX - startX)/zoom) + "px";
        }
    };

    window.onmouseup = () => { 
        if(isDragging || isResizing) { saveHistory(); saveToCloud(); } 
        isDragging = isResizing = isPanning = isSelecting = false; 
        document.getElementById('guide-x').style.display = 'none';
        document.getElementById('guide-y').style.display = 'none';
        document.getElementById('selection-box').style.display = 'none';
    };

    bd.onmousedown = (e) => { 
        if(currentLvl !== 4) return;
        if (e.detail === 2) document.querySelectorAll('.miro-item.is-editing').forEach(el => el.querySelector('[contenteditable]').blur());
        if(e.button === 1 || (e.target === bd || e.target === vp)) { 
            if(e.button === 0 && e.target === vp) {
                isSelecting = true; selectStartX = (e.clientX - panX) / zoom; selectStartY = (e.clientY - panY) / zoom;
                const box = document.getElementById('selection-box');
                box.style.display = 'block'; box.style.width = box.style.height = '0px';
            } else { isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY; }
            e.preventDefault(); 
        } 
    };

    bd.addEventListener('wheel', e => {
        if(currentLvl === 4) {
            e.preventDefault();
            const f = Math.pow(1.1, -e.deltaY/120);
            const nz = Math.min(Math.max(zoom * f, 0.05), 5);
            panX = e.clientX - (e.clientX - panX) * (nz/zoom);
            panY = e.clientY - (e.clientY - panY) * (nz/zoom);
            zoom = nz; updateViewport();
        }
    }, {passive:false});

    function updateViewport() { vp.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`; }

    // 原有工具函数保持不变...
    const uploadQueue = { tasks: {}, updateUI() { const list = document.getElementById('global-upload-list'); list.innerHTML = Object.values(this.tasks).map(t => `<div style="background:rgba(255,255,255,0.9); padding:12px; border-radius:10px; margin-bottom:10px; box-shadow:0 8px 20px rgba(0,0,0,0.1); border-left:4px solid ${t.status==='done'?'#34A853':'#4285F4'}; backdrop-filter:blur(5px);"><div style="font-size:10px; font-weight:700;">${t.fileName}</div><div style="font-size:9px; color:#888;">${t.statusText}</div><div style="height:3px; background:#eee; width:100%;"><div style="width:${t.progress}%; height:100%; background:#4285F4;"></div></div></div>`).join(''); } };
    async function compress(file) { return new Promise((resolve) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = (e) => { const img = new Image(); img.src = e.target.result; img.onload = () => { const canvas = document.createElement('canvas'); let { width: w, height: h } = img; canvas.width = w; canvas.height = h; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h); resolve(canvas.toDataURL('image/jpeg', 0.9).split(',')[1]); }; }; }); }
    async function handleUpload(event) { if(!isAdmin || !currentProj) return; const fs = Array.from(event.target.files); const dx = (window.innerWidth/2 - panX)/zoom, dy = (window.innerHeight/2 - panY)/zoom; fs.forEach(async (file, idx) => { const taskId = "task_" + Date.now() + "_" + idx; uploadQueue.tasks[taskId] = { fileName: file.name, progress: 10, status: 'uploading', statusText: '处理中...' }; uploadQueue.updateUI(); const rx = (dx+(idx*30))+'px', ry = (dy+(idx*30))+'px', isImg = file.type.includes('image'); const r = new FileReader(); r.onload = async (re) => { const item = createMiroItem(isImg ? `<img src="${re.target.result}">` : `<video src="${re.target.result}" autoplay loop muted></video>`, rx, ry); let b64 = isImg ? await compress(file) : await toBase64(file); const xhr = new XMLHttpRequest(); xhr.open('PUT', `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/media/${Date.now()}_${file.name}`); xhr.setRequestHeader('Authorization', `token ${CONFIG.token}`); xhr.upload.onprogress = (ev) => { uploadQueue.tasks[taskId].progress = 30 + Math.round((ev.loaded/ev.total)*65); uploadQueue.updateUI(); }; xhr.onload = () => { if(xhr.status === 201 || xhr.status === 200){ const remoteUrl = JSON.parse(xhr.responseText).content.download_url; item.querySelector('img, video').src = remoteUrl; uploadQueue.tasks[taskId].status = 'done'; uploadQueue.tasks[taskId].progress = 100; uploadQueue.updateUI(); saveToCloud(); setTimeout(() => { delete uploadQueue.tasks[taskId]; uploadQueue.updateUI(); }, 2000); } }; xhr.send(JSON.stringify({message: "Upload", content: b64})); }; r.readAsDataURL(file); }); }

    async function initSystem() {
        try { const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`, isAdmin && CONFIG.token ? {headers:{'Authorization':`token ${CONFIG.token}`}}: {}); if (res.ok) { const json = await res.json(); portfolio_data = JSON.parse(decodeURIComponent(escape(atob(json.content)))); } } catch (e) {}
        document.getElementById('loading-bar').style.width = "100%"; setTimeout(() => { document.getElementById('loading-screen').style.display = "none"; }, 500); if(currentLvl === 2) renderCatGrid();
    }

    function renderCatGrid() { const cats=['Architecture','Computational','Interest','Photo','Ongoing']; document.getElementById('catGrid').innerHTML=cats.map(cat=>{const ps=Object.keys(portfolio_data).filter(id=>id.startsWith(cat[0].toLowerCase())); const t=(ps.length&&portfolio_data[ps[0]].thumbs)?portfolio_data[ps[0]].thumbs[0]:''; return `<div class="stack-container" onclick="showLevel(3, '${cat}')"><div class="neural-stack"><div class="neural-layer layer-2"></div><div class="neural-layer layer-1">${t?`<img src="${t}">`:''}</div></div><div class="stack-label">${cat}</div></div>`;}).join(''); }
    function renderProjGrid() { const ps=Object.keys(portfolio_data).filter(id=>id.startsWith(currentCat[0].toLowerCase())).map(id=>({id,...portfolio_data[id]})); document.getElementById('projGrid').innerHTML=ps.map(p=>{ const t=p.thumbs||[]; const delBtn = isAdmin ? `<div class="delete-proj-btn" onclick="event.stopPropagation(); deleteProject('${p.id}', '${p.title}')">×</div>` : ''; return `<div class="stack-container" onclick="openProject('${p.id}')">${delBtn}<div class="neural-stack"><div class="neural-layer layer-3">${t[2]?`<img src="${t[2]}">`:''}</div><div class="neural-layer layer-2">${t[1]?`<img src="${t[1]}">`:''}</div><div class="neural-layer layer-1">${t[0]?`<img src="${t[0]}">`:''}</div></div><div class="stack-label">${p.title}</div></div>`; }).join(''); }
    
    function showLevel(lvl, cat = '') {
        currentLvl=lvl; if(cat)currentCat=cat; 
        document.querySelectorAll('.view-layer').forEach(el=>el.classList.remove('active')); 
        document.getElementById('lvl4').style.display=(lvl===4)?'flex':'none'; 
        if(lvl===2)renderCatGrid(); if(lvl===3)renderProjGrid(); 
        if(lvl===4){
            Array.from(vp.children).forEach(el => { if(el.classList.contains('miro-item')) el.remove(); });
            (portfolio_data[currentProj.id].layout||[]).forEach(it=>createMiroItem(it.html,it.x,it.y,it.w,it.h)); 
            setTimeout(() => { updateViewport(); saveHistory(); }, 50);
            document.getElementById('lvl4Title').innerText=portfolio_data[currentProj.id].title;
            document.getElementById('lvl4CatTag').innerText=currentCat;
        }
        document.getElementById('lvl'+lvl).classList.add('active'); 
        document.getElementById('mainNav').classList.toggle('visible', lvl>1); 
        document.getElementById('backBtnContainer').classList.toggle('show', lvl>1); 
        document.getElementById('addProjBtn').style.display=(lvl===3&&isAdmin)?'block':'none'; 
        if(isAdmin) {
            document.getElementById('lvl3AdminControls').style.display = (lvl === 3) ? 'flex' : 'none';
            document.getElementById('adminControls').style.display = (lvl === 4) ? 'flex' : 'none';
        }
    }

    function openProject(id) { currentProj={id,...portfolio_data[id]}; showLevel(4); }
    function handleBack() { if (currentLvl === 4) showLevel(3); else if (currentLvl === 3) showLevel(2); else showLevel(1); }
    function checkUnlock() { const p=prompt("Pass:"); if(p==="li123"){const t=prompt("Token:"); if(t&&t.startsWith('ghp_')){localStorage.setItem('gh_token', t.trim()); isAdmin=true; document.getElementById('adminInfo').innerText="ADMIN ACTIVE"; showLevel(currentLvl);}}}
    function initParticles() { cvs.width=window.innerWidth; cvs.height=window.innerHeight; pts=Array.from({length:80},()=>new Particle()); }
    function animate() { ctx.clearRect(0,0,cvs.width,cvs.height); m.smX+=(m.x-m.smX)*0.1; m.smY+=(m.y-m.smY)*0.1; pts.forEach(p=>p.update()); requestAnimationFrame(animate); }
    window.onload = () => { initParticles(); animate(); initSystem(); };
    window.onresize = () => { cvs.width=window.innerWidth; cvs.height=window.innerHeight; };
    document.getElementById('dynamicNav').innerHTML=['Architecture','Computational','Interest','Photo','Ongoing'].map(c=>`<a onclick="showLevel(3, '${c}')">${c}</a>`).join('');
</script>
</body>
